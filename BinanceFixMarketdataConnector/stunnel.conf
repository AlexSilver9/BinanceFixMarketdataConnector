; Stunnel configuration for Binance FIX API
; This terminates SSL/TLS and provides a plain TCP connection for QuickFIX

; Global options
foreground = yes
debug = 7
output = stunnel.log

; Service for Binance FIX Market Data
[binance-fix-md]
client = yes
accept = 127.0.0.1:9001
connect = fix-md.binance.com:9000

; Verify the Binance certificate
verify = 2
CAfile = /etc/ssl/cert.pem
checkHost = fix-md.binance.com
